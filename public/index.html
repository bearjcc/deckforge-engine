<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeckForge Engine - Generic Deck-Building Adventure Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      line-height: 1.6;
    }
    
    .game-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: #16213e;
      border-radius: 10px;
    }
    
    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    
    .game-status {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 8px;
    }
    
    .stat {
      font-size: 1.1em;
      font-weight: bold;
    }
    
    .enemy {
      background: #533483;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .enemy h3 {
      font-size: 1.8em;
      margin-bottom: 10px;
    }
    
    .enemy-health {
      font-size: 1.3em;
      margin: 10px 0;
    }
    
    .enemy-intent {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
    
    .player {
      background: #16213e;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .player > div {
      font-size: 1.2em;
    }
    
    .power {
      background: #e94560;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 0.9em;
    }
    
    .hand {
      margin-top: 30px;
    }
    
    .hand h3 {
      margin-bottom: 15px;
    }
    
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    
    .card {
      background: #fff;
      color: #333;
      border-radius: 8px;
      padding: 15px;
      border: 3px solid #ddd;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(255,255,255,0.3);
    }
    
    .card.attack {
      border-color: #e74c3c;
    }
    
    .card.skill {
      border-color: #3498db;
    }
    
    .card.power {
      border-color: #9b59b6;
    }
    
    .card-icon {
      font-size: 2.5em;
      text-align: center;
      margin-bottom: 10px;
    }
    
    .card-name {
      font-weight: bold;
      font-size: 1.1em;
      margin-bottom: 8px;
      text-align: center;
    }
    
    .card-cost {
      text-align: center;
      font-size: 0.9em;
      color: #666;
      margin-bottom: 8px;
    }
    
    .card-desc {
      font-size: 0.9em;
      color: #555;
      margin-bottom: 10px;
      min-height: 40px;
    }
    
    .play-btn {
      width: 100%;
      padding: 10px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
    }
    
    .play-btn:hover {
      background: #d63447;
    }
    
    .end-turn-btn {
      width: 100%;
      padding: 15px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2em;
    }
    
    .end-turn-btn:hover {
      background: #229954;
    }
    
    .game-over {
      background: #16213e;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      margin: 40px 0;
    }
    
    .game-over h2 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }
    
    .game-over button {
      padding: 15px 40px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.2em;
      margin-top: 20px;
    }
    
    .defeated {
      background: #333;
      color: #888;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div id="app">Loading game...</div>
  
  <script type="module">
    import {createGame} from './engine/game.js'
    import {createUI} from './ui/app.js'
    
    async function loadGame() {
      // Load all game data
      const [config, cards, enemies, encounters, gameData] = await Promise.all([
        fetch('./content/config.json').then(r => r.json()),
        fetch('./content/cards.json').then(r => r.json()),
        fetch('./content/enemies.json').then(r => r.json()),
        fetch('./content/encounters.json').then(r => r.json()),
        fetch('./content/game-data.json').then(r => r.json())
      ])
      
      const contentData = {
        cards,
        enemies,
        encounters,
        ...gameData
      }
      
      // Create game
      const game = createGame(config, contentData)
      
      // Create UI
      const container = document.getElementById('app')
      createUI(game, container)
    }
    
    loadGame().catch(err => {
      document.getElementById('app').innerHTML = `
        <div style="padding: 40px; text-align: center;">
          <h2>Error Loading Game</h2>
          <p>${err.message}</p>
          <pre>${err.stack}</pre>
        </div>
      `
    })
  </script>
</body>
</html>
