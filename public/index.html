<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeckForge Engine - Generic Deck-Building Adventure Game</title>
  <link rel="stylesheet" href="ui/styles.css">
</head>
<body>
  <div id="app">
    <div class="loading">
      <h2>🎴 Loading DeckForge...</h2>
      <p>Initializing game engine...</p>
    </div>
  </div>
  
  <script type="module">
    import {createGame} from './engine/game.js'
    import {createUI} from './ui/app.js'
    import {validateAllContent} from './engine/validator.js'
    
    async function loadGame() {
      // Load all game data
      const [config, cards, enemies, encounters, gameData] = await Promise.all([
        fetch('./content/config.json').then(r => r.json()),
        fetch('./content/cards.json').then(r => r.json()),
        fetch('./content/enemies.json').then(r => r.json()),
        fetch('./content/encounters.json').then(r => r.json()),
        fetch('./content/game-data.json').then(r => r.json())
      ])
      
      // Validate content
      const validation = validateAllContent(cards, enemies, config)
      if (!validation.valid) {
        console.error('❌ Content validation failed:', validation.errors)
        throw new Error('Invalid game content. Check console for details.')
      } else {
        console.log('✅ All content validated successfully!')
      }
      
      const contentData = {
        cards,
        enemies,
        encounters,
        ...gameData
      }
      
      // Create game
      const game = createGame(config, contentData)
      
      // Create UI
      const container = document.getElementById('app')
      createUI(game, container)
    }
    
    loadGame().catch(err => {
      document.getElementById('app').innerHTML = `
        <div style="padding: 40px; text-align: center; background: #1a1a2e; color: #fff; min-height: 100vh;">
          <h2 style="color: #e94560;">⚠️ Error Loading Game</h2>
          <p style="margin: 20px 0;">${err.message}</p>
          <details style="text-align: left; max-width: 800px; margin: 20px auto;">
            <summary style="cursor: pointer; color: #3498db;">Show Details</summary>
            <pre style="background: #000; padding: 20px; border-radius: 5px; overflow: auto;">${err.stack}</pre>
          </details>
          <p style="margin-top: 20px; color: #888;">Check the browser console for more information.</p>
        </div>
      `
    })
  </script>
</body>
</html>
